<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpArt Engine — advanced optical-art generator</title>
  <meta name="description" content="Browser-based Op Art generator: 22 patterns, two blendable layers, distortion warps, kaleidoscope symmetry, palettes, animation, high-resolution PNG export.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Op<span>Art</span> Engine</h1>
    <span id="subtitle"></span>
    <span class="spacer"></span>
    <button id="btn-lang" type="button">Türkçe</button>
    <button id="btn-theme" type="button" title="Theme">◐</button>
    <button id="btn-fs" type="button" title="Fullscreen">⛶</button>
  </header>
  <main>
    <div id="stage">
      <canvas id="view" width="800" height="800"></canvas>
      <div id="overlay" hidden></div>
    </div>
    <aside id="panel"></aside>
  </main>
  <footer>
    <span id="status">…</span>
    <span class="spacer"></span>
    <span id="hint"></span>
    <a href="https://github.com/hakanatas/OpArtEEngine" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
